name = "enrichment-worker"
main = "src/worker.py"
compatibility_date = "2026-09-12"
compatibility_flags = ["python_workers"]

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "sym-protocol"
database_id = "c8180dd7-0f8b-40b0-bc23-0ccae5260ca3"

# Cron trigger — every 2 minutes
[triggers]
# */15 — each run scans tokens + paper_trades history; */2 was ~2-4M
# D1 rows/day against the shared 5M/day free-tier quota.
crons = ["*/15 * * * *"]
account_id = "23738a036108482feac164d7eee10a30"
