name = "governance-worker"
main = "src/index.ts"
compatibility_date = "2026-09-12"
account_id = "6c0140469651854b2e358517371a03d3"

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "sym-protocol"
database_id = "a494ae7e-4efd-49c6-8058-603179e3fd23"

# Durable Object binding to fly-brain-do (cross-worker reference)
[[durable_objects.bindings]]
name = "FLY_BRAIN"
class_name = "ConnectomeDO"
script_name = "fly-brain-do"

# no cron — driven by fly-brain-do alarm chain

[vars]
# RPC_URL is a secret (keyed endpoint) — set via `wrangler secret put RPC_URL`
# The bare RPC 429s under load; use the apikey'd URL.
# RPC_URL = "https://rpc.mainnet.chain.robinhood.com"
USDC_ADDRESS = "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"
# FLYAI (fly.ai) — primary token on Robinhood mainnet (chain 4663)
FLYAI_TOKEN = "0x0088CE7905025c4B5ea1d49aB6179B6aaADB3B9C"
# Uniswap V4 pool ID (FLYAI/NVDA) — bytes32, not an ERC20 pair contract
FLYAI_POOL_ID = "0x04f9f653f1692bbffeda87a5436aded3e9c0bc65e0bd929747a3a64b67c1312e"
# Robinhood mainnet deployment (chain 4663, deployer 0xc6f12272...)
GOVERNOR_ADDRESS = "0x6a7a1df72301e6a09dd43adf2fdd4487994e72a8"
GOVERNOR_POLICY = "0x2257c925e5d6156cca11f0d7f9a69859d383099f"
TRSRY_ADDRESS = "0x056518a55e60328ddeb8b7a1de844c8d390989e1"
FEE_ROUTER = "0x0000000000000000000000000000000000000000"
INVERSE_BOND = "0x73fcf57ea4bb78b103e9323fad27b54fd7aeccf2"
STAKING = "0x60c11f1182b0313d17b96ff8f20a12611ab769c5"
RELAY_ENGINE = "0x0000000000000000000000000000000000000000"
# Not yet deployed on Robinhood: FeeRouter (needs V4 adapter),
# DecisionRelayEngine, TreasuryAllocator is 0x6429b17f42c3f188595f24d0bd721079ba4329a3
# Colony self-improvement loop — set to enable code ideation + PR auto-merge
# GITHUB_REPO = "owner/repo"           # target repo for colony PRs
# secret: npx wrangler secret put GITHUB_TOKEN   (fine-grained PAT, contents+pull-requests write)
