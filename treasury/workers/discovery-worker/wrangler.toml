name = "discovery-worker"
main = "src/index.ts"
compatibility_date = "2026-09-12"

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "sym-protocol"
database_id = "c8180dd7-0f8b-40b0-bc23-0ccae5260ca3"

# KV for caching
[[kv_namespaces]]
binding = "CACHE"
id = "c88ba0c20bd74e418b9f13d856ba2273"

# Cron trigger — every 1 minute (free: 3/Worker)
# no cron — driven by fly-brain-do alarm chain

[vars]
ARC_RPC = "https://rpc.testnet.arc.io"
account_id = "23738a036108482feac164d7eee10a30"
